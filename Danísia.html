<script>
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const mix = (a, b, t) => a + (b - a) * t;

const GRN = [[.08, .34, .07], [.27, .62, .16], [.70, .88, .42]];

// Folha/sépala: lâmina lanceolada pontilhada. Pose definida pelo ângulo inicial a0 e curvatura kap.
function leaf(out, col, off, o) {
  const { rho0, z0, psi, len, wm, a0, kap, cup, NV = 50, NW = 9, serr = 0, ox = 0 } = o;
  let rho = rho0, z = z0, p = off * 3;
  const cp = Math.cos(psi), sp = Math.sin(psi);
  for (let i = 0; i < NV; i++) {
    const v = i / (NV - 1), a = a0 + kap * v;
    const half = wm * (.3 + .7 * Math.sin(Math.PI * Math.pow(v, .7))) * (1 - Math.pow(v, 4)) * (1 + serr * Math.sin(v * 60));
    for (let j = 0; j < NW; j++) {
      const w = j / (NW - 1) * 2 - 1, wv = w * half, c = cup * wv * wv;
      const r = rho - c * Math.cos(a), zz = z + c * Math.sin(a);
      out[p] = r * cp - wv * sp + ox; out[p + 1] = zz; out[p + 2] = -(r * sp + wv * cp);
      if (col) { const g = lerp3(GRN, clamp(w * w * .6 + v * .35)); col[p] = g[0]; col[p + 1] = g[1]; col[p + 2] = g[2]; }
      p += 3;
    }
    rho += len / NV * Math.sin(a); z += len / NV * Math.cos(a);
  }

}

function createRose(NT = 1100, NU = 70) {

  const ng = (NZ + NR) * NS + (LV + SEP) * per;

  for (let j = 0; j < SEP; j++) leaf(gp, gc, sepOff + j * per, { rho0: .11, z0: -.03, psi: j / SEP * TAU + .3, len: .95, wm: .2, a0: 1.3, kap: -1.8, cup: 5 });

  const FAR = 1e4;

    for (let i = 0; i < nStem; i++) { const j = 3 * i; if (sz[i] <= Zt) { gp[j] = stem0[j]; gp[j + 1] = stem0[j + 1]; gp[j + 2] = stem0[j + 2]; } else gp[j + 1] = FAR; }
    for (const L of SL) {   // folhas do caule se desenrolam quando o caule chega nelas
      const gl = Math.max(sm(0, 1, (T - L.t0) / .1), .001);
      leaf(gp, null, L.off, { ...L.o, len: L.o.len * gl, wm: L.o.wm * gl, a0: mix(.3, L.o.a0, gl), kap: mix(.2, L.o.kap, gl) });

    }
    const p = sm(.15, .55, tb);
    for (let j = 0; j < SEP; j++) leaf(gp, null, sepOff + j * per, { rho0: .11, z0: -.03, psi: j / SEP * TAU + .3 + .5 * p, len: .95, wm: .2, a0: mix(1.3, 2.25, p), kap: mix(-1.8, .5, p), cup: mix(5, 1.5, p) });

    let a0 = -1, s = 0, sn = 0, cs = 1;
    for (let i = 0; i < n; i++) {
      if (sc < .01) { pp[3 * i + 1] = FAR; continue; }
      const k = kk[i];
      if (k !== a0) { a0 = k; s = sm(0, 1, (tb - .04 - .52 * k) / .42); const ang = th[i] - .9 * (1 - s); sn = Math.sin(ang); cs = Math.cos(ang); }

      pp[3 * i] = r * sn * sc; pp[3 * i + 1] = z * sc + off; pp[3 * i + 2] = -r * cs * sc;

}

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const hl = s => s.split("\n").map(l => { const i = l.indexOf("//"), c = i >= 0 ? l.slice(i) : "", t = i >= 0 ? l.slice(0, i) : l; return esc(t).replace(/(\b(?:const|let|for|function|return)\b)|(\bMath\b)|(\b\d*\.?\d+\b)/g, (m, a, b) => '<i class="' + (a ? "k" : b ? "m" : "n") + '">' + m + "</i>") + (c ? '<i class="c">' + esc(c) + "</i>" : ""); }).join("\n");
function typeCode() { const n = Math.floor(SRC.length * Math.min(1, T / .9)); if (n === shown) return; shown = n; codeEl.innerHTML = hl(SRC.slice(0, n)) + '<i class="cur">▌</i>'; }
const btn = document.getElementById("btn"), sl = document.getElementById("sl"), tm = document.getElementById("tm");
const fmt = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
btn.onclick = () => { if (T >= 1) T = 0; playing = !playing; };
sl.oninput = () => { T = sl.value / 1000; playing = false; };

const ptrs = new Map(); let lp = 0; const el = renderer.domElement;
el.addEventListener("pointerdown", e => { el.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e); });
el.addEventListener("pointerup", e => ptrs.delete(e.pointerId));
el.addEventListener("pointercancel", e => ptrs.delete(e.pointerId));
el.addEventListener("pointermove", e => {
  const pv = ptrs.get(e.pointerId); if (!pv) return;
  if (ptrs.size === 1) { yaw += (e.clientX - pv.clientX) * .008; pitch = clamp(pitch + (e.clientY - pv.clientY) * .005, -.5, .6); }
  ptrs.set(e.pointerId, e);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (lp) zoom = clamp(zoom * lp / d, .5, 1.8); lp = d; } else lp = 0;
});
el.addEventListener("wheel", e => { e.preventDefault(); zoom = clamp(zoom * (1 + e.deltaY * .001), .5, 1.8); }, { passive: false });
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

(function loop(now) {
  if (playing) { T = au.src && au.duration && !au.paused ? Math.min(1, au.currentTime / DUR) : Math.min(1, T + (now - last) / 1000 / DUR); } if (T >= 1) EXTRA += (now - last) / 1000 / DUR;
  last = now;
  const gl = .013 + .014 * sm(.2, 1, T) + .005 * Math.sin(now / 450);   // brilho pulsante, cresce com a abertura
  halos.forEach(m => m.opacity = gl);
  typeCode(); rose.update(T); light.update(T); gL.attributes.position.needsUpdate = true; gL.attributes.color.needsUpdate = true; gP.attributes.position.needsUpdate = true; gG.attributes.position.needsUpdate = true;
  // câmera: começa de perfil no botão e sobe/afasta para mostrar a flor aberta
  const ca = sm(0, .45, T), cb = sm(.45, 1, T), H = Math.max(mix(mix(5.6, 3.9, ca), 3.4, cb), 2.6 / camera.aspect) * zoom;
  group.position.y = -mix(mix(.3, -.4, ca), -.1, cb);
  group.rotation.set(mix(mix(.35, .3, ca), .8, cb) + pitch, 1.1 * T + yaw + .12 * (EXTRA * DUR + 2 * (Math.exp(-EXTRA * DUR / 2) - 1)), 0);
  camera.position.set(0, 0, H / (2 * Math.tan(FOV * Math.PI / 360)));
  renderer.render(scene, camera);
  sl.value = T * 1000; tm.textContent = fmt(T * DUR) + " / " + fmt(DUR); btn.textContent = playing ? "⏸" : (T >= 1 ? "↺" : "▶");
  requestAnimationFrame(loop);
})(performance.now());
</script>
